[project]
name = "flight-data-predictions"
version = "0.1.0"
description = "A flight price analysis and prediction"
readme = "README.md"
authors = [
    { name = "Bradley", email = "Bradley.todd.black@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "ruff>=0.16.8",
    "seaborn>=0.13.2",
]

[project.scripts]
flight-data-predictions = "flight_data_predictions:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
